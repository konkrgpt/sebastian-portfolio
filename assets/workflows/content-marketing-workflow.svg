<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="760" viewBox="0 0 1800 760"><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#38352c"/></pattern></defs><rect width="1800" height="760" rx="22" fill="#080909"/><rect x="1" y="1" width="1798" height="758" rx="22" fill="none" stroke="#635334"/><style>text{font-family:Arial,sans-serif}</style><text x="60" y="67" fill="#d6b779" font-size="18" letter-spacing="3">SR / CONTENT &amp; MARKETING WORKFLOWS</text><text x="60" y="129" fill="#f4f1e8" font-size="40" font-weight="bold">Prepare. Review. Publish with a person in control.</text><text x="60" y="176" fill="#b4b1a6" font-size="22">Component overview from archived project records; current operation not re-tested.</text><rect x="40" y="222" width="1720" height="300" rx="16" fill="url(#dots)" stroke="#332e24"/><rect x="65" y="274" width="380" height="190" rx="15" fill="#171912" stroke="#76623b"/><text x="88" y="309" fill="#d6b779" font-size="19">01</text><text x="88" y="351" fill="#f4f1e8" font-size="26" font-weight="bold">Agent-assisted planning</text><text x="88" y="394" fill="#b4b1a6" font-size="19">Briefs and workflow direction</text><text x="88" y="423" fill="#b4b1a6" font-size="19">Tool experience self-reported</text><path d="M450 369h36m-8-7 8 7-8 7" fill="none" stroke="#c5a76b" stroke-width="2"/><rect x="495" y="274" width="380" height="190" rx="15" fill="#171912" stroke="#76623b"/><text x="518" y="309" fill="#d6b779" font-size="19">02</text><text x="518" y="351" fill="#f4f1e8" font-size="26" font-weight="bold">Prepare assets</text><text x="518" y="394" fill="#b4b1a6" font-size="19">Ordered files, captions, manifests</text><text x="518" y="423" fill="#b4b1a6" font-size="19">Packaging implementation record</text><path d="M880 369h36m-8-7 8 7-8 7" fill="none" stroke="#c5a76b" stroke-width="2"/><rect x="925" y="274" width="380" height="190" rx="15" fill="#171912" stroke="#76623b"/><text x="948" y="309" fill="#d6b779" font-size="19">03</text><text x="948" y="351" fill="#f4f1e8" font-size="26" font-weight="bold">Human review</text><text x="948" y="394" fill="#b4b1a6" font-size="19">Approval before publication</text><text x="948" y="423" fill="#b4b1a6" font-size="19">Quality decisions retained</text><path d="M1310 369h36m-8-7 8 7-8 7" fill="none" stroke="#c5a76b" stroke-width="2"/><rect x="1355" y="274" width="380" height="190" rx="15" fill="#171912" stroke="#76623b"/><text x="1378" y="309" fill="#d6b779" font-size="19">04</text><text x="1378" y="351" fill="#f4f1e8" font-size="26" font-weight="bold">Supervised publish</text><text x="1378" y="394" fill="#b4b1a6" font-size="19">Instagram API experiment</text><text x="1378" y="423" fill="#b4b1a6" font-size="19">Documented; later withdrawn</text><rect x="60" y="566" width="1680" height="112" rx="12" fill="#211c12" stroke="#5f4a27"/><text x="84" y="606" fill="#d6b779" font-size="20" letter-spacing="2">PLANNED EXPANSION</text><text x="84" y="647" fill="#f4f1e8" font-size="24">TikTok Shop product marketing / platform integration and campaign measurement still required</text><text x="60" y="721" fill="#a49d8c" font-size="18">Historical records support individual components. This is not proof of a fully autonomous end-to-end campaign system.</text></svg>