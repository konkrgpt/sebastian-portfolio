<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850"><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#3c382e"/></pattern></defs><rect width="1600" height="850" rx="22" fill="#080909"/><rect x="1" y="1" width="1598" height="848" rx="22" fill="none" stroke="#5c4b2c"/><style>text{font-family:Arial,sans-serif}</style><path d="M0 65H1600" stroke="#393326"/><circle cx="30" cy="33" r="5" fill="#bda16a"/><circle cx="50" cy="33" r="5" fill="#5b5548"/><circle cx="70" cy="33" r="5" fill="#5b5548"/><text x="100" y="40" font-size="17" fill="#ada694">SR / RESEARCH ENGINEERING</text><text x="55" y="132" fill="#f4f1e8" font-size="37" font-weight="bold">Who builds, who checks, who approves</text><text x="55" y="171" fill="#b4b1a6" font-size="19">Task delegation and independent review, with human approval for material changes.</text><rect x="35" y="212" width="1530" height="540" rx="14" fill="url(#grid)" stroke="#29271f"/><text x="65" y="261" fill="#d6b779" font-size="16" letter-spacing="2">01 / SET THE TASK</text><path d="M381 350H437" fill="none" stroke="#927b4c" stroke-width="2"/><path d="M430 345L437 350L430 355" fill="none" stroke="#927b4c" stroke-width="2"/><rect x="65" y="292" width="316" height="146" rx="13" fill="#161813" stroke="#5b513b"/><rect x="65" y="312" width="3" height="30" fill="#d6b779"/><text x="85" y="326" fill="#f4f1e8" font-size="21" font-weight="bold">Human operator</text><text x="85" y="358" fill="#b4b1a6" font-size="17">Goals, constraints and</text><text x="85" y="383" fill="#b4b1a6" font-size="17">approval boundaries</text><path d="M381 526H437" fill="none" stroke="#927b4c" stroke-width="2"/><path d="M430 521L437 526L430 531" fill="none" stroke="#927b4c" stroke-width="2"/><rect x="65" y="468" width="316" height="146" rx="13" fill="#161813" stroke="#5b513b"/><rect x="65" y="488" width="3" height="30" fill="#d6b779"/><text x="85" y="502" fill="#f4f1e8" font-size="21" font-weight="bold">Coordinator</text><text x="85" y="534" fill="#b4b1a6" font-size="17">Distributes the study spec</text><text x="85" y="559" fill="#b4b1a6" font-size="17">and collects evidence</text><text x="447" y="261" fill="#d6b779" font-size="16" letter-spacing="2">02 / SPECIALIST WORK</text><path d="M763 350H819" fill="none" stroke="#927b4c" stroke-width="2"/><path d="M812 345L819 350L812 355" fill="none" stroke="#927b4c" stroke-width="2"/><rect x="447" y="292" width="316" height="146" rx="13" fill="#161813" stroke="#5b513b"/><rect x="447" y="312" width="3" height="30" fill="#d6b779"/><text x="467" y="326" fill="#f4f1e8" font-size="21" font-weight="bold">Research lanes</text><text x="467" y="358" fill="#b4b1a6" font-size="17">Same specification</text><text x="467" y="383" fill="#b4b1a6" font-size="17">Independent data and code</text><path d="M763 526H819" fill="none" stroke="#927b4c" stroke-width="2"/><path d="M812 521L819 526L812 531" fill="none" stroke="#927b4c" stroke-width="2"/><rect x="447" y="468" width="316" height="146" rx="13" fill="#161813" stroke="#5b513b"/><rect x="447" y="488" width="3" height="30" fill="#d6b779"/><text x="467" y="502" fill="#f4f1e8" font-size="21" font-weight="bold">Build + monitoring</text><text x="467" y="534" fill="#b4b1a6" font-size="17">Local coding agents</text><text x="467" y="559" fill="#b4b1a6" font-size="17">Monitoring assignments</text><text x="829" y="261" fill="#d6b779" font-size="16" letter-spacing="2">03 / VERIFY</text><path d="M1145 350H1201" fill="none" stroke="#927b4c" stroke-width="2"/><path d="M1194 345L1201 350L1194 355" fill="none" stroke="#927b4c" stroke-width="2"/><rect x="829" y="292" width="316" height="146" rx="13" fill="#161813" stroke="#5b513b"/><rect x="829" y="312" width="3" height="30" fill="#d6b779"/><text x="849" y="326" fill="#f4f1e8" font-size="21" font-weight="bold">Independent checks</text><text x="849" y="358" fill="#b4b1a6" font-size="17">Reproduce calculations</text><text x="849" y="383" fill="#b4b1a6" font-size="17">Cross-check the evidence</text><path d="M1145 526H1201" fill="none" stroke="#927b4c" stroke-width="2"/><path d="M1194 521L1201 526L1194 531" fill="none" stroke="#927b4c" stroke-width="2"/><rect x="829" y="468" width="316" height="146" rx="13" fill="#161813" stroke="#5b513b"/><rect x="829" y="488" width="3" height="30" fill="#d6b779"/><text x="849" y="502" fill="#f4f1e8" font-size="21" font-weight="bold">Verification result</text><text x="849" y="534" fill="#b4b1a6" font-size="17">Pass / fail with evidence</text><text x="849" y="559" fill="#b4b1a6" font-size="17">Returned to coordinator</text><text x="1211" y="261" fill="#d6b779" font-size="16" letter-spacing="2">04 / DECIDE</text><rect x="1211" y="292" width="316" height="146" rx="13" fill="#161813" stroke="#5b513b"/><rect x="1211" y="312" width="3" height="30" fill="#d6b779"/><text x="1231" y="326" fill="#f4f1e8" font-size="21" font-weight="bold">Coordinator review</text><text x="1231" y="358" fill="#b4b1a6" font-size="17">Collect findings</text><text x="1231" y="383" fill="#b4b1a6" font-size="17">Escalate material changes</text><rect x="1211" y="468" width="316" height="146" rx="13" fill="#161813" stroke="#5b513b"/><rect x="1211" y="488" width="3" height="30" fill="#d6b779"/><text x="1231" y="502" fill="#f4f1e8" font-size="21" font-weight="bold">Human approval</text><text x="1231" y="534" fill="#b4b1a6" font-size="17">Rule changes and freezes</text><text x="1231" y="559" fill="#b4b1a6" font-size="17">Any outbound posting</text><text x="55" y="804" fill="#b9ad94" font-size="17">Generic architecture recreation. No credentials, private endpoints, or live execution results.</text></svg>