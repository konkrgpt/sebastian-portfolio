<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#3c382e"/></pattern></defs><rect width="1600" height="1000" rx="22" fill="#080909"/><rect x="1" y="1" width="1598" height="998" rx="22" fill="none" stroke="#5c4b2c"/><style>text{font-family:Arial,sans-serif}</style><path d="M0 65H1600" stroke="#393326"/><circle cx="30" cy="33" r="5" fill="#bda16a"/><circle cx="50" cy="33" r="5" fill="#5b5548"/><circle cx="70" cy="33" r="5" fill="#5b5548"/><text x="100" y="40" font-size="17" fill="#ada694">SR / RESEARCH ENGINEERING</text><text x="55" y="132" fill="#f4f1e8" font-size="37" font-weight="bold">From research task to reviewed evidence</text><text x="55" y="171" fill="#b4b1a6" font-size="19">A coordinator-led system with separate data, analysis and reporting components.</text><rect x="35" y="212" width="1530" height="690" rx="14" fill="url(#grid)" stroke="#29271f"/><text x="65" y="261" fill="#d6b779" font-size="16" letter-spacing="2">01 / AGENT LAYER</text><path d="M381 350H437" fill="none" stroke="#927b4c" stroke-width="2"/><path d="M430 345L437 350L430 355" fill="none" stroke="#927b4c" stroke-width="2"/><rect x="65" y="292" width="316" height="146" rx="13" fill="#161813" stroke="#5b513b"/><rect x="65" y="312" width="3" height="30" fill="#d6b779"/><text x="85" y="326" fill="#f4f1e8" font-size="21" font-weight="bold">Human + coordinator</text><text x="85" y="358" fill="#b4b1a6" font-size="17">Set goals and constraints</text><text x="85" y="383" fill="#b4b1a6" font-size="17">Assign and review work</text><path d="M381 526H437" fill="none" stroke="#927b4c" stroke-width="2"/><path d="M430 521L437 526L430 531" fill="none" stroke="#927b4c" stroke-width="2"/><rect x="65" y="468" width="316" height="146" rx="13" fill="#161813" stroke="#5b513b"/><rect x="65" y="488" width="3" height="30" fill="#d6b779"/><text x="85" y="502" fill="#f4f1e8" font-size="21" font-weight="bold">Specialist agents</text><text x="85" y="534" fill="#b4b1a6" font-size="17">Research, verification,</text><text x="85" y="559" fill="#b4b1a6" font-size="17">monitoring and coding</text><path d="M381 702H437" fill="none" stroke="#927b4c" stroke-width="2"/><path d="M430 697L437 702L430 707" fill="none" stroke="#927b4c" stroke-width="2"/><rect x="65" y="644" width="316" height="146" rx="13" fill="#161813" stroke="#5b513b"/><rect x="65" y="664" width="3" height="30" fill="#d6b779"/><text x="85" y="678" fill="#f4f1e8" font-size="21" font-weight="bold">Human approval</text><text x="85" y="710" fill="#b4b1a6" font-size="17">Material changes and</text><text x="85" y="735" fill="#b4b1a6" font-size="17">outbound actions reviewed</text><text x="447" y="261" fill="#d6b779" font-size="16" letter-spacing="2">02 / DATA LAYER</text><path d="M763 350H819" fill="none" stroke="#927b4c" stroke-width="2"/><path d="M812 345L819 350L812 355" fill="none" stroke="#927b4c" stroke-width="2"/><rect x="447" y="292" width="316" height="146" rx="13" fill="#161813" stroke="#5b513b"/><rect x="447" y="312" width="3" height="30" fill="#d6b779"/><text x="467" y="326" fill="#f4f1e8" font-size="21" font-weight="bold">Public data sources</text><text x="467" y="358" fill="#b4b1a6" font-size="17">Public REST API, mirror</text><text x="467" y="383" fill="#b4b1a6" font-size="17">and historical archives</text><path d="M763 526H819" fill="none" stroke="#927b4c" stroke-width="2"/><path d="M812 521L819 526L812 531" fill="none" stroke="#927b4c" stroke-width="2"/><rect x="447" y="468" width="316" height="146" rx="13" fill="#161813" stroke="#5b513b"/><rect x="447" y="488" width="3" height="30" fill="#d6b779"/><text x="467" y="502" fill="#f4f1e8" font-size="21" font-weight="bold">Fetcher + local cache</text><text x="467" y="534" fill="#b4b1a6" font-size="17">Explicit failures on</text><text x="467" y="559" fill="#b4b1a6" font-size="17">HTTP 403 or 451</text><path d="M763 702H819" fill="none" stroke="#927b4c" stroke-width="2"/><path d="M812 697L819 702L812 707" fill="none" stroke="#927b4c" stroke-width="2"/><rect x="447" y="644" width="316" height="146" rx="13" fill="#161813" stroke="#5b513b"/><rect x="447" y="664" width="3" height="30" fill="#d6b779"/><text x="467" y="678" fill="#f4f1e8" font-size="21" font-weight="bold">Data verification</text><text x="467" y="710" fill="#b4b1a6" font-size="17">Archive checksums and</text><text x="467" y="735" fill="#b4b1a6" font-size="17">mirror comparisons</text><text x="829" y="261" fill="#d6b779" font-size="16" letter-spacing="2">03 / RESEARCH TOOLS</text><path d="M1145 350H1201" fill="none" stroke="#927b4c" stroke-width="2"/><path d="M1194 345L1201 350L1194 355" fill="none" stroke="#927b4c" stroke-width="2"/><rect x="829" y="292" width="316" height="146" rx="13" fill="#161813" stroke="#5b513b"/><rect x="829" y="312" width="3" height="30" fill="#d6b779"/><text x="849" y="326" fill="#f4f1e8" font-size="21" font-weight="bold">Scanners + charts</text><text x="849" y="358" fill="#b4b1a6" font-size="17">Multiple timeframes</text><text x="849" y="383" fill="#b4b1a6" font-size="17">Radar and outcome ledger</text><path d="M1145 526H1201" fill="none" stroke="#927b4c" stroke-width="2"/><path d="M1194 521L1201 526L1194 531" fill="none" stroke="#927b4c" stroke-width="2"/><rect x="829" y="468" width="316" height="146" rx="13" fill="#161813" stroke="#5b513b"/><rect x="829" y="488" width="3" height="30" fill="#d6b779"/><text x="849" y="502" fill="#f4f1e8" font-size="21" font-weight="bold">Evaluation harness</text><text x="849" y="534" fill="#b4b1a6" font-size="17">Frozen rules, cost model</text><text x="849" y="559" fill="#b4b1a6" font-size="17">Holdout + replication</text><path d="M1145 702H1201" fill="none" stroke="#927b4c" stroke-width="2"/><path d="M1194 697L1201 702L1194 707" fill="none" stroke="#927b4c" stroke-width="2"/><rect x="829" y="644" width="316" height="146" rx="13" fill="#161813" stroke="#5b513b"/><rect x="829" y="664" width="3" height="30" fill="#d6b779"/><text x="849" y="678" fill="#f4f1e8" font-size="21" font-weight="bold">Forward paper log</text><text x="849" y="710" fill="#b4b1a6" font-size="17">Prospective records</text><text x="849" y="735" fill="#b4b1a6" font-size="17">Log-only risk overlay</text><text x="1211" y="261" fill="#d6b779" font-size="16" letter-spacing="2">04 / OUTPUTS</text><rect x="1211" y="292" width="316" height="146" rx="13" fill="#161813" stroke="#5b513b"/><rect x="1211" y="312" width="3" height="30" fill="#d6b779"/><text x="1231" y="326" fill="#f4f1e8" font-size="21" font-weight="bold">Reports + archives</text><text x="1231" y="358" fill="#b4b1a6" font-size="17">Daily status reports</text><text x="1231" y="383" fill="#b4b1a6" font-size="17">Checksummed exports</text><rect x="1211" y="468" width="316" height="146" rx="13" fill="#161813" stroke="#5b513b"/><rect x="1211" y="488" width="3" height="30" fill="#d6b779"/><text x="1231" y="502" fill="#f4f1e8" font-size="21" font-weight="bold">Notification publisher</text><text x="1231" y="534" fill="#b4b1a6" font-size="17">DRY RUN ONLY</text><text x="1231" y="559" fill="#b4b1a6" font-size="17">No live posting</text><rect x="1211" y="644" width="316" height="146" rx="13" fill="#161813" stroke="#5b513b"/><rect x="1211" y="664" width="3" height="30" fill="#d6b779"/><text x="1231" y="678" fill="#f4f1e8" font-size="21" font-weight="bold">Inbound report relay</text><text x="1231" y="710" fill="#b4b1a6" font-size="17">2 verified deliveries</text><text x="1231" y="735" fill="#b4b1a6" font-size="17">Not production integration</text><text x="55" y="954" fill="#b9ad94" font-size="17">Generic architecture recreation. No credentials, private endpoints, or live execution results.</text></svg>